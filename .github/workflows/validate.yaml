name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons ship in custom_components/ergon_outages/brand/,
          # not in the home-assistant/brands repo.
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Current Home Assistant releases require Python 3.14; older Python
          # silently installs an old Home Assistant instead.
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
