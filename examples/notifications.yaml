# Ergon outage notifications
# Paste into Settings > Automations & Scenes > Create automation > ⋮ > Edit in YAML.
# Replace notify.notify with your phone, e.g. notify.mobile_app_your_phone.
#
# The integration fires one event per outage change, and remembers what it has
# already announced (across restarts), so you only ever get one alert per event.
# One automation covers every location you've added to the integration.
alias: Ergon outage alerts
description: Phone alerts for new, starting and cleared Ergon outages
mode: queued
triggers:
  - trigger: event
    event_type: ergon_outages_new_outage
    id: new
  - trigger: event
    event_type: ergon_outages_outage_started
    id: started
  - trigger: event
    event_type: ergon_outages_outage_cleared
    id: cleared
  # Optional: status / estimated restoration changes. Can be chatty during storms.
  # - trigger: event
  #   event_type: ergon_outages_outage_updated
  #   id: updated
actions:
  - variables:
      o: "{{ trigger.event.data }}"
      start: >-
        {{ as_timestamp(o.start) | timestamp_custom('%a %-d %b, %-I:%M %p')
           if o.start else 'now' }}
      restore: >-
        {{ as_timestamp(o.estimated_restoration) | timestamp_custom('%a %-d %b, %-I:%M %p')
           if o.estimated_restoration else 'not yet known' }}
  - action: notify.notify
    data:
      # Map zoomed to this outage (red = now, orange = upcoming); the link keeps
      # working for 7 days. Tapping the alert opens the outage's pop-up in
      # Home Assistant: its map plus every detail (url = iOS, clickAction = Android).
      data: >-
        {% set ns = namespace(d={}) %}
        {% if o.map_url %}{% set ns.d = dict(ns.d, image=o.map_url) %}{% endif %}
        {% if o.detail_entity_id %}
          {% set tap = '/?more-info-entity-id=' ~ o.detail_entity_id %}
          {% set ns.d = dict(ns.d, url=tap, clickAction=tap) %}
        {% endif %}
        {{ ns.d }}
      # Every title names the location, so several locations can share
      # this one automation.
      title: >-
        {% if trigger.id == 'cleared' %}✅ Outage cleared
        {%- elif trigger.id == 'updated' %}🔄 Outage update
        {%- elif o.phase == 'current' %}⚡ Power outage now
        {%- else %}📅 Planned outage{% endif %} · {{ o.location }}
      message: |-
        {%- if trigger.id == 'cleared' -%}
        Outage {{ o.event_id }} is no longer listed by Ergon.
        {%- else -%}
        {{ o.reason or 'Power interruption' }}
        {{ (o.outage_type or '') | capitalize }} · {{ o.status or 'Status unknown' }}
        Start: {{ start }} · Restore: {{ restore }}
        Customers affected: {{ o.customers_affected if o.customers_affected is not none else 'unknown' }}
        {%- endif %}
